[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chatbot"
version = "0.2.13"
description = "Mac-first live voice backend (on-device STT, Responses API, Siri TTS) driven by the pi-voice extension"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "JLDynamics" },
]
# Fork of huggingface/speech-to-speech (Apache-2.0). The upstream
# copyright notice lives in LICENSE and NOTICE; this field records who
# maintains *this* fork.
keywords = ["voice-agents", "speech-recognition", "text-to-speech", "openai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: MacOS :: MacOS X",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.115.0",
    "huggingface-hub>=0.34.0",
    "httpx>=0.28.0",
    "nltk==3.10.0",
    "numpy>=1.26.0,<2.4.4",
    "openai==2.28.0",
    "onnxruntime>=1.17.0",
    "pydantic>=2.0",
    "rich>=13.0",
    "scipy>=1.10.0",
    "soxr>=1.1.0",
    "torch==2.11.0",
    "torchaudio==2.11.0",
    "transformers==5.15.1",
    "uvicorn>=0.30.0",
    "websockets>=12.0",
    "lingua-language-detector>=2.0.2",
]

[project.urls]
Homepage = "https://github.com/JLDynamics/pi-voice"
Repository = "https://github.com/JLDynamics/pi-voice"
Issues = "https://github.com/JLDynamics/pi-voice/issues"

[project.scripts]
chatbot = "chatbot.cli:main"

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-asyncio",
]


[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.uv]
package = true
prerelease = "allow"
default-groups = ["dev"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["chatbot*"]
exclude = ["tests*"]

[tool.ruff]
src = ["src"]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_configs = true
check_untyped_defs = false
